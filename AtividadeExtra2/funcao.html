<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabuada</title>
  <link rel="stylesheet" href="funcao.css">
</head>
<body>
  <main class="container">
    <h1>Tabuada</h1>

    <div class="campo">
      <label for="numero">Número inteiro (1 a 10)</label>
      <input type="number" id="numero" placeholder="Ex: 7" step="1" min="1" max="10">
    </div>

    <button id="btnGerar">Gerar tabuada</button>

    <pre id="resultado" class="resultado"></pre>
  </main>

  <script src="funcao.js"></script>
</body>
</html>
